<!-- Contact Section -->
<section class="py-20">
  <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-12">

    <!-- Contact Form -->
    <div class="bg-slate-900 p-8 rounded-xl shadow-lg">
      <h2 class="text-3xl font-bold mb-6 text-emerald-400">Send Message</h2>

      <form class="space-y-4">
        <input type="text" placeholder="Your Name" 
        class="w-full p-3 rounded bg-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">

        <input type="email" placeholder="Your Email" 
        class="w-full p-3 rounded bg-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">

        <textarea placeholder="Your Message" rows="4"
        class="w-full p-3 rounded bg-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>

        <button class="bg-emerald-500 w-full py-3 rounded-lg hover:bg-emerald-600 transition">
          Send Message
        </button>
      </form>
    </div>

    <!-- Contact Details -->
    <div class="space-y-8">

      <div class="bg-slate-900 p-6 rounded-xl shadow-lg">
        <h3 class="text-xl font-bold text-emerald-400 mb-3">Contact Information</h3>
        <p class="text-gray-400 mb-2">📞 Phone: +92 323 8778543</p>
        <p class="text-gray-400 mb-2">📧 Email: support@basittrading.com</p>
        <p class="text-gray-400">📍 Office: Lahore, Pakistan</p>
      </div>

      <div class="bg-slate-900 p-6 rounded-xl shadow-lg">
        <h3 class="text-xl font-bold text-emerald-400 mb-3">Connect With Us</h3>
        <div class="flex gap-4">
          <a href="#" class="bg-slate-800 px-4 py-2 rounded hover:bg-emerald-500 transition">
            Facebook
          </a>
          <a href="#" class="bg-slate-800 px-4 py-2 rounded hover:bg-emerald-500 transition">

          </a>
          <a href="#" class="bg-slate-800 px-4 py-2 rounded hover:bg-emerald-500 transition">
            Twitter
          </a>

      </div>

      <a href="https://wa.me/923238778543" 
      class="block text-center bg-green-600 py-4 rounded-xl text-lg font-bold hover:bg-green-700 transition">
        💬 Chat on WhatsApp
